name: Test pull_request event context - d-day-labeler
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run d-day-labeler action with pull_request context
        id: action
        uses: .
        with:
          token: fake-token-for-testing
        continue-on-error: true
      - name: Assert action ran in pull_request context
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action will attempt to call GitHub API which will fail in act,
          # but it should not be skipped.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action executed in pull_request context (outcome: ${{ steps.action.outcome }})"
