name: Test basic usage - d-day-labeler runs with valid token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run d-day-labeler action
        id: action
        uses: .
        with:
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should succeed with a valid token when there are no D-n labeled PRs.
          # It may also fail gracefully if it encounters write permission issues.
          # Either way, it must have actually run (not been skipped or cancelled).
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was not run (outcome: $OUTCOME)"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with valid token"
          else
            echo "INFO: action ran but did not succeed (outcome: $OUTCOME) - may be a permissions issue"
            echo "PASS: action ran without crashing the runner"
          fi
